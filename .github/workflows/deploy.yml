name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'boards/**' # board data commits (written by the app itself) shouldn't trigger a redeploy
      - 'workspaces/**' # same for the admin account registry
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_BRANCH: ${{ github.ref_name }}
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
          VITE_ADMIN_KEY: ${{ secrets.VITE_ADMIN_KEY }}
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Same app built for the custom domain (root base path). Downloaded with
      # `gh run download -n hostzone-dist` and uploaded to the host over SFTP.
      - name: Build for Hostzone
        env:
          VITE_BASE_PATH: /
          VITE_GITHUB_OWNER: ${{ github.repository_owner }}
          VITE_GITHUB_REPO: ${{ github.event.repository.name }}
          VITE_GITHUB_BRANCH: ${{ github.ref_name }}
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
          VITE_ADMIN_KEY: ${{ secrets.VITE_ADMIN_KEY }}
          VITE_SITE_URL: https://moodboard.sarkozypatrik.sk
        run: npx vite build --outDir dist-hostzone

      - uses: actions/upload-artifact@v4
        with:
          name: hostzone-dist
          path: dist-hostzone
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
